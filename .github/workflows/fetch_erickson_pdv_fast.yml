name: Temporary Erickson PDV fast CEMPRE extraction

on:
  pull_request:
    paths:
      - 'trigger_erickson_pdv_fast.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch CEMPRE 47.11-3 and Division 47
        shell: bash
        run: |
          cat > /tmp/fetch_fast.py <<'PY'
          import csv, gzip, json, time, urllib.request
          from pathlib import Path
          OUT=Path('erickson_pdv_fast'); OUT.mkdir(exist_ok=True)
          BASE='https://servicodados.ibge.gov.br/api/v3/agregados/9528/periodos/2024/variaveis/706|707'
          specs={
            'uf_class_47113':f'{BASE}?localidades=N3[all]&classificacao=12762[117440]',
            'municipality_class_47113':f'{BASE}?localidades=N6[all]&classificacao=12762[117440]',
            'uf_division_47':f'{BASE}?localidades=N3[all]&classificacao=12762[117438]',
            'municipality_division_47':f'{BASE}?localidades=N6[all]&classificacao=12762[117438]',
          }
          def get(url):
            headers={'User-Agent':'Mozilla/5.0 Erickson-PDV/fast','Accept':'application/json','Accept-Encoding':'gzip'}
            last=None
            for i in range(6):
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=240) as r:
                  raw=r.read()
                  if r.headers.get('Content-Encoding','').lower()=='gzip' or raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
                  return json.loads(raw.decode('utf-8'))
              except Exception as exc:
                last=exc; time.sleep(min(20,2**i))
            raise RuntimeError(f'{url} :: {last}')
          def norm_value(v):
            t=str(v).strip()
            if t in {'','-','..','...','X','x'}: return None
            try: return float(t.replace(' ','').replace(',','.'))
            except: return None
          def flatten(payload,name,url):
            rows=[]
            for vb in payload if isinstance(payload,list) else []:
              for result in vb.get('resultados',[]):
                cls=[]
                for c in result.get('classificacoes',[]):
                  for k,v in (c.get('categoria',{}) or {}).items(): cls.append(f"{c.get('id')}:{k}={v}")
                for s in result.get('series',[]):
                  loc=s.get('localidade',{}) or {}; lev=loc.get('nivel',{}) or {}
                  for period,raw in (s.get('serie',{}) or {}).items():
                    rows.append({'source_name':name,'variable_id':str(vb.get('id','')),'variable':vb.get('variavel',''),'unit':vb.get('unidade',''),'period':str(period),'location_level_id':str(lev.get('id','')),'location_level':lev.get('nome',''),'location_id':str(loc.get('id','')),'location':loc.get('nome',''),'classification':' | '.join(cls),'raw_value':raw,'value':norm_value(raw),'source_url':url})
            return rows
          manifest={'retrieved_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'sources':[]}
          for name,url in specs.items():
            payload=get(url)
            (OUT/f'{name}_raw.json').write_text(json.dumps(payload,ensure_ascii=False),encoding='utf-8')
            rows=flatten(payload,name,url)
            if rows:
              with (OUT/f'{name}.csv').open('w',newline='',encoding='utf-8-sig') as f:
                w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
            manifest['sources'].append({'name':name,'url':url,'rows':len(rows),'numeric_rows':sum(r['value'] is not None for r in rows)})
            print(name,len(rows),sum(r['value'] is not None for r in rows))
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
          python /tmp/fetch_fast.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: erickson-pdv-fast-cempre
          path: erickson_pdv_fast/
          retention-days: 1
