name: Temporary Erickson PDV state CEMPRE extraction

on:
  pull_request:
    paths:
      - 'trigger_erickson_pdv_state.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch state data
        shell: bash
        run: |
          python - <<'PY'
          import csv,gzip,json,time,urllib.request
          from pathlib import Path
          OUT=Path('out');OUT.mkdir(exist_ok=True)
          specs={
            'uf_class_47113':'https://servicodados.ibge.gov.br/api/v3/agregados/9528/periodos/2024/variaveis/706|707?localidades=N3[all]&classificacao=12762[117440]',
            'uf_division_47':'https://servicodados.ibge.gov.br/api/v3/agregados/9528/periodos/2024/variaveis/706|707?localidades=N3[all]&classificacao=12762[117438]'
          }
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Accept-Encoding':'gzip'})
            with urllib.request.urlopen(req,timeout=240) as r:
              raw=r.read()
              if r.headers.get('Content-Encoding','').lower()=='gzip' or raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
              return json.loads(raw.decode('utf-8'))
          def val(x):
            t=str(x).strip()
            if t in {'','-','..','...','X','x'}: return None
            try:return float(t.replace(',','.'))
            except:return None
          def flatten(payload,name,url):
            rows=[]
            for vb in payload:
              for result in vb.get('resultados',[]):
                cats=[]
                for c in result.get('classificacoes',[]):
                  for k,v in (c.get('categoria',{}) or {}).items():cats.append(f"{c.get('id')}:{k}={v}")
                for s in result.get('series',[]):
                  loc=s.get('localidade',{}) or {};lev=loc.get('nivel',{}) or {}
                  for p,raw in (s.get('serie',{}) or {}).items():
                    rows.append({'source_name':name,'variable_id':str(vb.get('id')),'variable':vb.get('variavel'),'unit':vb.get('unidade'),'period':str(p),'location_level_id':str(lev.get('id')),'location_level':lev.get('nome'),'location_id':str(loc.get('id')),'location':loc.get('nome'),'classification':' | '.join(cats),'raw_value':raw,'value':val(raw),'source_url':url})
            return rows
          manifest=[]
          for name,url in specs.items():
            rows=flatten(get(url),name,url)
            with (OUT/f'{name}.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
            manifest.append({'name':name,'rows':len(rows),'numeric':sum(r['value'] is not None for r in rows),'url':url})
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: erickson-pdv-state-cempre
          path: out/
          retention-days: 1
