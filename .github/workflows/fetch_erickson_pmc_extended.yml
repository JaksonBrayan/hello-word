name: Temporary Erickson extended PMC extraction

on:
  pull_request:
    paths:
      - 'trigger_erickson_pmc_extended.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch extended historical PMC
        shell: bash
        run: |
          cat > /tmp/fetch_pmc_extended.py <<'PY'
          import csv,gzip,json,time,urllib.request
          from pathlib import Path
          OUT=Path('erickson_pmc_extended');OUT.mkdir(exist_ok=True)
          BASE='https://servicodados.ibge.gov.br/api/v3/agregados'
          PERIODS=[f'{y}{m:02d}' for y in range(2015,2027) for m in range(1,13) if y<2026 or m<=6]
          ACTS={90671:'Combustíveis e lubrificantes',90672:'Hipermercados, supermercados, produtos alimentícios, bebidas e fumo',103154:'Hipermercados e supermercados',90673:'Tecidos, vestuário e calçados',2759:'Móveis e eletrodomésticos',31555:'Móveis',31556:'Eletrodomésticos',103155:'Artigos farmacêuticos, médicos, ortopédicos, de perfumaria e cosméticos',103156:'Livros, jornais, revistas e papelaria',103157:'Equipamentos e materiais para escritório, informática e comunicação',103158:'Outros artigos de uso pessoal e doméstico',103159:'Veículos, motocicletas, partes e peças',2762:'Material de construção',56741:'Atacado especializado em produtos alimentícios, bebidas e fumo'}
          headers={'User-Agent':'Mozilla/5.0 Erickson-TCC/6.0','Accept':'application/json','Accept-Encoding':'gzip'}
          def get(url):
            last=None
            for i in range(6):
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read()
                  if r.headers.get('Content-Encoding','').lower()=='gzip' or raw[:2]==b'\x1f\x8b':raw=gzip.decompress(raw)
                  return json.loads(raw.decode('utf-8'))
              except Exception as exc:last=exc;time.sleep(min(20,2**i))
            raise RuntimeError(f'{url} :: {last}')
          def num(v):
            s=str(v).strip()
            if s in {'','-','..','...','X','x'}:return None
            try:return float(s.replace(' ','').replace(',','.'))
            except:return None
          def flatten(payload,source,extra,url):
            rows=[]
            for vb in payload if isinstance(payload,list) else []:
              for result in vb.get('resultados',[]):
                labels=[];ids=[]
                for cls in result.get('classificacoes',[]):
                  for cid,label in (cls.get('categoria',{}) or {}).items():
                    ids.append(f"{cls.get('id')}:{cid}");labels.append(f"{cls.get('nome')}={label}")
                for series in result.get('series',[]):
                  loc=series.get('localidade',{}) or {};level=loc.get('nivel',{}) or {}
                  for period,raw in (series.get('serie',{}) or {}).items():
                    row={'source_name':source,'table_id':str(vb.get('id','')),'variable_id':str(vb.get('id','')),'variable':vb.get('variavel',''),'unit':vb.get('unidade',''),'period':str(period),'location_level_id':str(level.get('id','')),'location_level':level.get('nome',''),'location_id':str(loc.get('id','')),'location':loc.get('nome',''),'classification_ids':' | '.join(ids),'classification_labels':' | '.join(labels),'raw_value':raw,'value':num(raw),'source_url':url}
                    row.update(extra);rows.append(row)
            return rows
          def write(name,rows):
            if not rows or sum(r['value'] is not None for r in rows)==0:raise RuntimeError(f'No numeric rows {name}')
            fields=list(rows[0])
            with (OUT/f'{name}.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
            print(name,len(rows),sum(r['value'] is not None for r in rows))
          periods='|'.join(PERIODS)
          uf=[]
          for locs in ['N1[all]','N3[all]']:
            url=f'{BASE}/8880/periodos/{periods}/variaveis/7170?localidades={locs}&classificacao=11046[56734]'
            uf.extend(flatten(get(url),'PMC_UF_AJUSTADA',{'activity_id':'TOTAL','activity':'Comércio varejista'},url))
          write('pmc_uf_extended',uf)
          sector=[]
          for aid,aname in ACTS.items():
            for locs in ['N1[all]','N3[all]']:
              url=f'{BASE}/8883/periodos/{periods}/variaveis/7169?localidades={locs}&classificacao=11046[all]|85[{aid}]'
              sector.extend(flatten(get(url),'PMC_SETOR_SEM_AJUSTE',{'activity_id':str(aid),'activity':aname},url))
          write('pmc_sector_extended',sector)
          manifest={'retrieved_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'period_start':PERIODS[0],'period_end':PERIODS[-1],'pmc_uf_rows':len(uf),'pmc_sector_rows':len(sector),'activities':ACTS}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/fetch_pmc_extended.py
      - name: Upload PMC data
        uses: actions/upload-artifact@v4
        with:
          name: erickson-pmc-extended
          path: erickson_pmc_extended/
          retention-days: 1
