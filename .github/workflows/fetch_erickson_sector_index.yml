name: Temporary Erickson PMC sector index extraction

on:
  pull_request:
    paths:
      - 'trigger_erickson_sector_index.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch unadjusted volume index by activity
        shell: bash
        run: |
          cat > /tmp/fetch_sector.py <<'PY'
          import csv,gzip,json,time,urllib.request
          from pathlib import Path
          OUT=Path('erickson_sector_index');OUT.mkdir(exist_ok=True)
          BASE='https://servicodados.ibge.gov.br/api/v3/agregados'
          PERIODS=[f'{y}{m:02d}' for y in range(2020,2027) for m in range(1,13) if y<2026 or m<=6]
          ACTS={90671:'Combustíveis e lubrificantes',90672:'Hipermercados, supermercados, produtos alimentícios, bebidas e fumo',103154:'Hipermercados e supermercados',90673:'Tecidos, vestuário e calçados',2759:'Móveis e eletrodomésticos',31555:'Móveis',31556:'Eletrodomésticos',103155:'Artigos farmacêuticos, médicos, ortopédicos, de perfumaria e cosméticos',103156:'Livros, jornais, revistas e papelaria',103157:'Equipamentos e materiais para escritório, informática e comunicação',103158:'Outros artigos de uso pessoal e doméstico',103159:'Veículos, motocicletas, partes e peças',2762:'Material de construção',56741:'Atacado especializado em produtos alimentícios, bebidas e fumo'}
          headers={'User-Agent':'Mozilla/5.0 Erickson-TCC/5.0','Accept':'application/json','Accept-Encoding':'gzip'}
          def get(url):
            last=None
            for i in range(6):
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read()
                  if r.headers.get('Content-Encoding','').lower()=='gzip' or raw[:2]==b'\x1f\x8b':raw=gzip.decompress(raw)
                  return json.loads(raw.decode('utf-8'))
              except Exception as exc:last=exc;time.sleep(min(20,2**i))
            raise RuntimeError(f'{url} :: {last}')
          def num(v):
            s=str(v).strip()
            if s in {'','-','..','...','X','x'}:return None
            try:return float(s.replace(' ','').replace(',','.'))
            except:return None
          rows=[];periods='|'.join(PERIODS)
          for aid,aname in ACTS.items():
            url=f'{BASE}/8883/periodos/{periods}/variaveis/7169?localidades=N3[all]&classificacao=11046[all]|85[{aid}]'
            payload=get(url)
            for vb in payload if isinstance(payload,list) else []:
              for result in vb.get('resultados',[]):
                labels=[];ids=[]
                for cls in result.get('classificacoes',[]):
                  for cid,label in (cls.get('categoria',{}) or {}).items():
                    ids.append(f"{cls.get('id')}:{cid}");labels.append(f"{cls.get('nome')}={label}")
                for series in result.get('series',[]):
                  loc=series.get('localidade',{}) or {};level=loc.get('nivel',{}) or {}
                  for period,raw in (series.get('serie',{}) or {}).items():
                    rows.append({'table_id':'8883','variable_id':'7169','variable':vb.get('variavel',''),'unit':vb.get('unidade',''),'period':str(period),'location_level_id':str(level.get('id','')),'location_level':level.get('nome',''),'location_id':str(loc.get('id','')),'location':loc.get('nome',''),'classification_ids':' | '.join(ids),'classification_labels':' | '.join(labels),'raw_value':raw,'value':num(raw),'activity_id':str(aid),'activity':aname,'source_url':url})
          if not rows or sum(r['value'] is not None for r in rows)==0:raise RuntimeError('No numeric sector rows')
          fields=list(rows[0])
          with (OUT/'pmc_sector_index.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          (OUT/'manifest.json').write_text(json.dumps({'retrieved_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'rows':len(rows),'numeric_rows':sum(r['value'] is not None for r in rows)},ensure_ascii=False,indent=2),encoding='utf-8')
          print(len(rows),sum(r['value'] is not None for r in rows))
          PY
          python /tmp/fetch_sector.py
      - name: Upload sector data
        uses: actions/upload-artifact@v4
        with:
          name: erickson-pmc-sector-index
          path: erickson_sector_index/
          retention-days: 1
