name: Temporary Erickson SIDRA direct extraction

on:
  pull_request:
    paths:
      - 'trigger_erickson_sidra_direct.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch SIDRA direct tables
        shell: bash
        run: |
          cat > /tmp/fetch_sidra.py <<'PY'
          import csv, gzip, json, time, urllib.request
          from pathlib import Path

          OUT=Path('erickson_sidra_output'); OUT.mkdir(exist_ok=True)
          periods='|'.join([f'{y}{m:02d}' for y in range(2020,2027) for m in range(1,13) if y<2026 or m<=6])
          specs={
            'pmc_uf': f'https://apisidra.ibge.gov.br/values/t/8880/n3/all/v/7170/p/{periods}/c/11046/56734/h/y',
            'pmc_sector': f'https://apisidra.ibge.gov.br/values/t/8883/n3/all/v/7170/p/{periods}/c/11046/56736/c/85/all/h/y',
            'cempre_uf': 'https://apisidra.ibge.gov.br/values/t/9528/n3/all/v/706/p/2024/c/12762/all/h/y',
            'cempre_municipality': 'https://apisidra.ibge.gov.br/values/t/9510/n6/all/v/706/p/2024/c/12762/all/h/y',
          }
          headers={'User-Agent':'Mozilla/5.0 Erickson-TCC-research/3.0','Accept':'application/json','Accept-Encoding':'gzip'}
          def get(url):
            last=None
            for i in range(7):
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=240) as r:
                  raw=r.read()
                  if r.headers.get('Content-Encoding','').lower()=='gzip' or raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
                  return json.loads(raw.decode('utf-8'))
              except Exception as exc:
                last=exc; time.sleep(min(30,2**i))
            raise RuntimeError(f'{url} :: {last}')

          manifest={'retrieved_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'sources':[]}
          for name,url in specs.items():
            data=get(url)
            (OUT/f'{name}_raw.json').write_text(json.dumps(data,ensure_ascii=False),encoding='utf-8')
            if not isinstance(data,list) or len(data)<2:
              raise RuntimeError(f'Empty response for {name}: {data}')
            header=data[0]
            rows=data[1:]
            keys=list(header.keys())
            with (OUT/f'{name}.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=keys)
              w.writerow(header)
              for row in rows: w.writerow({k:row.get(k) for k in keys})
            manifest['sources'].append({'name':name,'url':url,'rows':len(rows),'columns':header})
            print(name,len(rows),header)
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/fetch_sidra.py
      - name: Upload official data
        uses: actions/upload-artifact@v4
        with:
          name: erickson-sidra-direct-data
          path: erickson_sidra_output/
          retention-days: 1
