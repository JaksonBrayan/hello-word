name: Temporary Erickson SIDRA municipality extraction

on:
  pull_request:
    paths:
      - 'trigger_erickson_sidra_municipality.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch municipal class data via SIDRA direct API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import csv,json,time,urllib.request
          from pathlib import Path
          OUT=Path('out')
          specs={
            'municipality_class_units':'https://apisidra.ibge.gov.br/values/t/9528/n6/all/v/706/p/2024/c12762/117440/h/y/f/a',
            'municipality_class_people':'https://apisidra.ibge.gov.br/values/t/9528/n6/all/v/707/p/2024/c12762/117440/h/y/f/a',
            'municipality_retail_units':'https://apisidra.ibge.gov.br/values/t/9528/n6/all/v/706/p/2024/c12762/117438/h/y/f/a',
            'municipality_retail_people':'https://apisidra.ibge.gov.br/values/t/9528/n6/all/v/707/p/2024/c12762/117438/h/y/f/a',
          }
          def get(url):
            last=None
            for i in range(8):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=300) as r:
                  return json.loads(r.read().decode('utf-8'))
              except Exception as exc:
                last=exc;time.sleep(min(30,2**i))
            raise RuntimeError(f'{url} :: {last}')
          manifest=[]
          for name,url in specs.items():
            data=get(url)
            (OUT/f'{name}.json').write_text(json.dumps(data,ensure_ascii=False),encoding='utf-8')
            if not isinstance(data,list) or len(data)<2:
              raise RuntimeError(f'Empty/invalid response {name}: {data}')
            header=data[0];rows=data[1:];keys=list(header.keys())
            with (OUT/f'{name}.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=keys);w.writerow(header);w.writerows([{k:r.get(k) for k in keys} for r in rows])
            manifest.append({'name':name,'rows':len(rows),'url':url,'header':header})
            print(name,len(rows),header)
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: erickson-sidra-municipality
          path: out/
          retention-days: 1
