name: Temporary IBGE PPM extraction

on:
  pull_request:
    paths:
      - 'trigger_ibge_extract.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and normalize official IBGE PPM data
        shell: bash
        run: |
          cat > /tmp/fetch_ibge.py <<'PY'
          import csv
          import gzip
          import json
          import time
          import urllib.request
          from pathlib import Path

          YEARS = list(range(2015, 2025))
          UFS = {"50": "MS", "51": "MT", "52": "GO"}
          BASE = "https://servicodados.ibge.gov.br/api/v3/agregados"
          OUT = Path("ibge_output")
          OUT.mkdir(exist_ok=True)

          def get_json(url, attempts=6):
              headers = {"User-Agent": "Mozilla/5.0 IBGE-PPM-research/1.0", "Accept": "application/json", "Accept-Encoding": "gzip"}
              last_error = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=90) as response:
                          raw = response.read()
                          if response.headers.get("Content-Encoding", "").lower() == "gzip" or raw[:2] == b"\x1f\x8b":
                              raw = gzip.decompress(raw)
                          return json.loads(raw.decode("utf-8"))
                  except Exception as exc:
                      last_error = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(f"Failed after {attempts} attempts: {url} :: {last_error}")

          def build_url(table, variable, uf_code, classification=None):
              periods = "|".join(map(str, YEARS))
              url = f"{BASE}/{table}/periodos/{periods}/variaveis/{variable}?localidades=N6[N3[{uf_code}]]"
              if classification:
                  url += f"&classificacao={classification}"
              return url

          def extract_series(payload, metric, uf_code, source_url):
              rows = []
              if not payload:
                  return rows
              variable_block = payload[0]
              unit = variable_block.get("unidade")
              for result in variable_block.get("resultados", []):
                  for item in result.get("series", []):
                      loc = item.get("localidade", {})
                      loc_id = str(loc.get("id", ""))
                      loc_name = loc.get("nome", "")
                      if not loc_id or len(loc_id) < 6:
                          continue
                      clean_name = loc_name.rsplit(" - ", 1)[0]
                      for year, value in item.get("serie", {}).items():
                          if str(year) not in {str(y) for y in YEARS}:
                              continue
                          try:
                              numeric = float(str(value).replace(" ", "").replace(",", "."))
                          except (TypeError, ValueError):
                              numeric = None
                          rows.append({
                              "uf_code": uf_code,
                              "uf": UFS[uf_code],
                              "municipality_id": loc_id,
                              "municipality": clean_name,
                              "year": int(year),
                              "metric": metric,
                              "value": numeric,
                              "unit": unit,
                              "source_url": source_url,
                          })
              return rows

          specs = [
              ("3939", "105", "79[2670]", "cattle_heads"),
              ("74", "106", "80[2682]", "milk_quantity"),
              ("94", "107", None, "cows_milked"),
          ]

          long_rows = []
          raw_manifest = []
          for uf_code in UFS:
              for table, variable, classification, metric in specs:
                  url = build_url(table, variable, uf_code, classification)
                  payload = get_json(url)
                  raw_file = OUT / f"raw_{metric}_{UFS[uf_code]}.json"
                  raw_file.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
                  extracted = extract_series(payload, metric, uf_code, url)
                  if not extracted:
                      raise RuntimeError(f"No municipality rows extracted for {metric} {UFS[uf_code]} from {url}")
                  long_rows.extend(extracted)
                  raw_manifest.append({"uf": UFS[uf_code], "metric": metric, "url": url, "rows": len(extracted), "raw_file": raw_file.name})

          fieldnames = ["uf_code", "uf", "municipality_id", "municipality", "year", "metric", "value", "unit", "source_url"]
          with (OUT / "ppm_long.csv").open("w", newline="", encoding="utf-8-sig") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(long_rows)

          wide = {}
          for row in long_rows:
              key = (row["uf_code"], row["uf"], row["municipality_id"], row["municipality"], row["year"])
              rec = wide.setdefault(key, {
                  "uf_code": row["uf_code"], "uf": row["uf"],
                  "municipality_id": row["municipality_id"], "municipality": row["municipality"],
                  "year": row["year"], "cattle_heads": None, "milk_quantity": None, "cows_milked": None,
              })
              rec[row["metric"]] = row["value"]

          wide_rows = sorted(wide.values(), key=lambda x: (x["uf"], x["municipality"], x["year"]))
          with (OUT / "ppm_wide.csv").open("w", newline="", encoding="utf-8-sig") as f:
              writer = csv.DictWriter(f, fieldnames=list(wide_rows[0].keys()))
              writer.writeheader()
              writer.writerows(wide_rows)

          manifest = {
              "source": "IBGE - Pesquisa da Pecuária Municipal (PPM), API de Agregados v3",
              "retrieved_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "years": YEARS,
              "states": UFS,
              "specifications": raw_manifest,
              "long_rows": len(long_rows),
              "wide_rows": len(wide_rows),
          }
          (OUT / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          python /tmp/fetch_ibge.py

      - name: Upload official raw and normalized data
        uses: actions/upload-artifact@v4
        with:
          name: ibge-ppm-go-mt-ms-2015-2024
          path: ibge_output/
          retention-days: 1
